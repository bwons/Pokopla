<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pokopla — The Pokopia Planning Tool</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pokopla">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
  :root{
    --bg:#14171c;
    --panel:#1c2029;
    --panel-2:#232838;
    --line:#2c3244;
    --text:#e7e9f0;
    --text-dim:#9aa1b4;
    --accent:#7dd3c0;
    --accent-2:#e0a458;
    --danger:#e0637a;
    --radius:10px;
    font-family: "IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Inter","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:18px 24px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
    background:var(--panel);
    position:sticky;
    top:0;
    z-index:20;
  }
  header h1{
    font-family:"IBM Plex Mono",monospace;
    font-size:15px;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin:0;
    color:var(--accent);
    white-space:nowrap;
  }
  header h1 .subtitle{
    display:block;
    font-size:9px;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-top:1px;
  }
  nav.tabs{
    display:flex;
    gap:4px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
  }
  nav.tabs button{
    border:none;
    background:transparent;
    color:var(--text-dim);
    padding:7px 16px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:.15s;
  }
  nav.tabs button.active{
    background:var(--accent);
    color:#0c1210;
  }
  .searchwrap{
    flex:1;
    min-width:180px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  input[type=text], select{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:8px 10px;
    font-size:13px;
    font-family:inherit;
  }
  input[type=text]:focus, select:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  #search{width:100%;}
  .iconbtn{
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text-dim);
    border-radius:8px;
    padding:8px 12px;
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
  }
  .iconbtn:hover{color:var(--text);border-color:var(--accent);}
  .discardbtn{border-color:var(--danger);color:var(--danger);}
  .discardbtn:hover{background:rgba(224,99,122,.12);color:var(--danger);border-color:var(--danger);}
  .savebtn{background:var(--accent);color:#0c1210;border-color:var(--accent);font-weight:700;}
  .savebtn:hover{filter:brightness(1.1);color:#0c1210;border-color:var(--accent);}
  .asklabel{
    display:flex;align-items:center;gap:6px;
    font-size:12px;color:var(--text-dim);white-space:nowrap;
    cursor:pointer;user-select:none;
  }
  .asklabel input[type=checkbox]{accent-color:var(--accent);cursor:pointer;width:14px;height:14px;}
  #status{font-size:11px;color:var(--text-dim);white-space:nowrap;}
  #status.ok{color:var(--accent);}
  #status.warn{color:var(--accent-2);}

  main{padding:22px 24px 80px;max-width:1400px;margin:0 auto;}

  .filterbar{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .filterbar label{font-size:12px;color:var(--text-dim);}

  .table-scroll{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    border-radius:var(--radius);
  }

  table{
    width:100%;
    min-width:760px;
    border-collapse:collapse;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  thead th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--text-dim);
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    background:var(--panel-2);
  }
  tbody td{
    padding:9px 12px;
    border-bottom:1px solid var(--line);
    font-size:13px;
    vertical-align:middle;
  }
  tbody tr:hover{background:rgba(255,255,255,0.02);}
  tbody tr:last-child td{border-bottom:none;}
  .nr{color:var(--text-dim);font-family:"IBM Plex Mono",monospace;font-size:12px;}
  .name{font-weight:600;}
  .abilities{color:var(--text-dim);font-size:12px;}
  .litem{font-size:12px;color:var(--accent-2);}

  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:3px 9px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    border:1px solid transparent;
  }
  .badgebtn{
    font-family:inherit;
    margin:0 0 4px;
    cursor:pointer;
    transition:filter .15s;
  }
  .badgebtn:hover{filter:brightness(1.15);}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}

  select.groupselect{min-width:150px;max-width:180px;}
  select.habitatselect{min-width:150px;max-width:190px;}

  /* Gruppen view */
  .newgroup{
    display:flex;
    gap:10px;
    align-items:center;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .newgroup input[type=text]{flex:1;min-width:160px;}
  .newgroup input[type=color]{
    width:38px;height:38px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer;
  }
  .primarybtn{
    background:var(--accent);
    color:#0c1210;
    border:none;
    border-radius:8px;
    padding:9px 16px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .primarybtn:hover{filter:brightness(1.08);}
  .primarybtn:disabled{opacity:.4;cursor:not-allowed;}

  .groupgrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));
    gap:14px;
  }
  .groupcard{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    border-top:3px solid var(--accent);
  }
  .groupcard .cardhead{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    flex-wrap:wrap;
  }
  .cardhead-actions{
    display:flex;
    align-items:center;
    gap:6px;
    flex:none;
  }
  .groupcard h3{
    margin:0 0 2px;
    font-size:15px;
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  .groupcard .desc{
    font-size:12px;
    color:var(--text-dim);
    margin:2px 0 10px;
    line-height:1.4;
  }
  .statusbtn{
    border-radius:999px;
    padding:4px 11px;
    font-size:11px;
    line-height:16px;
    font-weight:700;
    cursor:pointer;
    letter-spacing:.03em;
    flex:none;
    border:1px solid transparent;
    transition:filter .15s;
    white-space:nowrap;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    height:26px;
    box-sizing:border-box;
  }
  .statusbtn:hover{filter:brightness(1.12);}
  .statusbtn.wip{
    background:rgba(224,164,88,.16);
    border-color:var(--accent-2);
    color:var(--accent-2);
  }
  .statusbtn.done{
    background:rgba(125,211,192,.16);
    border-color:var(--accent);
    color:var(--accent);
  }
  .editbtn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    border-radius:7px;
    padding:4px 9px;
    font-size:11px;
    line-height:16px;
    cursor:pointer;
    flex:none;
    white-space:nowrap;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    height:26px;
    box-sizing:border-box;
  }
  .editbtn:hover{color:var(--text);border-color:var(--accent);}
  .cardedit{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:10px;
  }
  .colorname{display:flex;gap:8px;flex:1;min-width:0;}
  .colorname input[type=text]{flex:1;min-width:0;}
  .cardedit input[type=color]{
    width:38px;height:36px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer;flex:none;
  }
  .cardedit input[type=text]{width:100%;}
  .cardedit .editrow, .editrow{display:flex;justify-content:space-between;gap:8px;margin-top:10px;}
  .addpoke{
    margin-top:2px;
    border-top:1px dashed var(--line);
    padding-top:10px;
  }
  .addpoke label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:5px;}
  .addpoke-results{
    max-height:130px;
    overflow:auto;
    margin-top:6px;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .addpoke-results button{
    text-align:left;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    padding:5px 8px;
    font-size:12px;
    cursor:pointer;
  }
  .addpoke-results button:hover{border-color:var(--accent);}
  .addpoke-results .nomatch{font-size:12px;color:var(--text-dim);font-style:italic;padding:4px 2px;}
  .groupcard .count{font-size:12px;color:var(--text-dim);margin-bottom:10px;}
  .groupcard ul{
    list-style:none;padding:0;margin:0 0 12px;
    max-height:150px;overflow:auto;
    display:flex;flex-direction:column;gap:4px;
  }
  .groupcard li{font-size:12.5px;color:var(--text);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;}
  .groupcard li:hover{color:var(--accent);}
  .groupcard li .hab{color:var(--text-dim);font-size:11px;font-style:italic;}
  .groupcard li[draggable]{cursor:grab;}
  .member-main{display:flex;align-items:baseline;gap:6px;min-width:0;flex:1;overflow:hidden;}
  .member-name{flex:none;}
  .member-abilities{font-size:10.5px;color:var(--text-dim);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;}
  .groupcard li.dragging{opacity:.4;}
  .groupcard.drag-over,
  .groupcard[data-gid].drag-over,
  .groupcard[data-hid].drag-over{outline:2px dashed var(--accent);outline-offset:2px;}
  .member-right{display:flex;align-items:center;gap:6px;flex:none;}
  .member-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  select.member-habitat{
    font-size:10.5px;padding:2px 4px;max-width:100px;border-radius:5px;
  }
  .removepoke{
    background:transparent;border:none;color:var(--text-dim);
    cursor:pointer;font-size:15px;line-height:1;padding:0 3px;flex:none;
  }
  .removepoke:hover{color:var(--danger);}
  .groupcard .empty{font-size:12px;color:var(--text-dim);font-style:italic;}
  .groupcard .actions{display:flex;justify-content:flex-end;}
  .inline-desc{width:100%;margin:2px 0 10px;}
  .dangerbtn{
    background:transparent;
    border:1px solid var(--danger);
    color:var(--danger);
    border-radius:8px;
    padding:6px 12px;
    font-size:12px;
    cursor:pointer;
  }
  .dangerbtn:hover{background:rgba(224,99,122,.12);}
  .dangerbtn.small{padding:4px 9px;font-size:11px;}

  .sectiontitle{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--text-dim);
    margin:0 0 12px;
    border-bottom:1px solid var(--line);
    padding-bottom:8px;
  }
  .customtag{
    display:inline-block;
    font-size:10px;
    color:var(--accent-2);
    border:1px solid var(--accent-2);
    border-radius:999px;
    padding:1px 7px;
    margin-left:6px;
    vertical-align:middle;
    text-transform:uppercase;
    letter-spacing:.04em;
  }

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(6,8,12,.6);
    display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .modal{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    max-width:380px;
    width:100%;
  }
  .modal h3{margin:0 0 8px;font-size:15px;}
  .modal p{font-size:13px;color:var(--text-dim);line-height:1.5;margin:0 0 18px;}
  .modal .row{display:flex;gap:10px;justify-content:flex-end;}
  .ghostbtn{
    background:transparent;border:1px solid var(--line);color:var(--text-dim);
    border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;
  }
  .ghostbtn:hover{color:var(--text);}

  .empty-state{
    text-align:center;color:var(--text-dim);padding:40px 0;font-size:13px;
  }
  footer{
    text-align:center;color:var(--text-dim);font-size:11px;padding:30px 20px 10px;
  }
  footer a{color:var(--text-dim);text-decoration:underline;text-underline-offset:2px;}
  footer a:hover{color:var(--accent);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
</style>
</head>
<body>

<header>
  <h1>◆ Pokopla <span class="subtitle">The Pokopia Planning Tool</span></h1>
  <nav class="tabs">
    <button id="tab-pokemon" class="active">Pokémon</button>
    <button id="tab-groups">Gruppen &amp; Habitate</button>
  </nav>
  <button class="iconbtn" id="btn-lang">🌐 EN</button>
  <button class="iconbtn" id="btn-editmode">✎ Bearbeiten</button>
  <button class="iconbtn" id="btn-export">⇩ Export JSON</button>
  <button class="iconbtn" id="btn-import">⇧ Import JSON</button>
  <button class="iconbtn discardbtn" id="btn-discard" style="display:none;">🗑 Verwerfen</button>
  <button class="iconbtn savebtn" id="btn-save" style="display:none;">💾 Speichern</button>
  <label class="asklabel" id="ask-before-removal-wrap" style="display:none;">
    <input type="checkbox" id="ask-before-removal" checked>
    <span id="ask-before-removal-text">Vor Entfernen fragen</span>
  </label>
  <input type="file" id="file-import" accept="application/json" style="display:none;">
  <span id="status">Speicher wird geprüft…</span>
</header>

<main>

  <div id="view-pokemon">
    <div class="newgroup" id="new-pokemon-form" style="display:none;">
      <input type="text" id="new-poke-nr" placeholder="Nr. (z. B. C-001)" style="width:110px;">
      <input type="text" id="new-poke-name" placeholder="Name" style="flex:1;min-width:140px;">
      <input type="text" id="new-poke-abilities" placeholder="Fähigkeit(en), kommagetrennt" style="flex:1;min-width:180px;">
      <input type="text" id="new-poke-litter" placeholder="Litter-Item (optional)" style="width:160px;">
      <button class="primarybtn" id="btn-add-pokemon">+ Pokémon anlegen</button>
    </div>
    <div class="filterbar">
      <div class="searchwrap" id="searchwrap">
        <input type="text" id="search" placeholder="Pokémon suchen…">
      </div>
      <label for="filter-group" id="lbl-filter-group">Nach Gruppe filtern:</label>
      <select id="filter-group"><option value="">Alle</option></select>
      <label for="filter-ability" id="lbl-filter-ability" style="margin-left:10px;">Nach Fähigkeit:</label>
      <select id="filter-ability"><option value="">Alle</option></select>
    </div>
    <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th id="th-nr" style="width:60px;">Nr.</th>
          <th id="th-pokemon">Pokémon</th>
          <th id="th-ability">Fähigkeit(en)</th>
          <th id="th-litter">Litter-Item</th>
          <th id="th-group" style="width:190px;">Gruppe</th>
          <th id="th-habitat" style="width:160px;">Habitat</th>
          <th id="th-action" style="width:110px;display:none;">Aktion</th>
        </tr>
      </thead>
      <tbody id="pokemon-tbody"></tbody>
    </table>
    </div>
  </div>

  <div id="view-groups" style="display:none;">
    <h2 class="sectiontitle" id="sec-groups-title">Custom-Gruppen</h2>
    <div class="newgroup">
      <input type="color" id="new-group-color" value="#7dd3c0">
      <input type="text" id="new-group-name" placeholder="Name der neuen Gruppe…">
      <input type="text" id="new-group-desc" placeholder="Beschreibung (optional)…">
      <button class="primarybtn" id="btn-add-group">+ Gruppe anlegen</button>
    </div>
    <div class="groupgrid" id="groups-grid"></div>

    <h2 class="sectiontitle" id="sec-habitats-title" style="margin-top:34px;">Habitate</h2>
    <div class="newgroup">
      <input type="text" id="new-habitat-name" placeholder="Name des neuen Habitats (z. B. für DLC)…">
      <input type="text" id="new-habitat-desc" placeholder="Beschreibung (optional)…">
      <button class="primarybtn" id="btn-add-habitat">+ Habitat anlegen</button>
    </div>
    <div class="groupgrid" id="habitats-grid"></div>
  </div>

</main>

<footer><span id="footer-text">Daten liegen lokal in diesem Tool (window.storage) · Export empfiehlt sich als Backup</span> · <a href="https://github.com/bwons/Pokopla" target="_blank" rel="noopener" id="footer-github">📂 Quellcode auf GitHub</a></footer>

/* ---------------------------------------------------------
   STATE + STORAGE
--------------------------------------------------------- */
let lang = "en"; // 'de' | 'en' — Anzeigesprache für Pokémon-Namen & Fähigkeiten
let groups = [];       // {id,name,color,description}
let assignments = {};  // pokemonId -> {groupId, habitatId}
let habitats = [];     // {id,name,description} — erweiterbar
let customPokemon = []; // selbst angelegte Pokémon, gleiche Form wie POKEMON_DATA + custom:true
let editMode = false;
let storageMode = "checking"; // 'window' | 'memory'

const DEFAULT_HABITATS = [
  {name:"Withered Wastelands", description:""},
  {name:"Bleak Beach", description:""},
  {name:"Rocky Ridges", description:""},
  {name:"Sparkling Skylands", description:""},
  {name:"Palette Town", description:""},
  {name:"Bubbly Basin", description:"Deutscher Name: Blubbmeeria"}
].map(({name,description}) => ({id: uidStatic(name), name, description}));

// stabile IDs für die Default-Habitate, damit sie bei jedem Neustart gleich bleiben
function uidStatic(seed){
  return "default__" + seed.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}

const KEY_GROUPS = "pokopia:groups";
const KEY_ASSIGN = "pokopia:assignments";
const KEY_HABITATS = "pokopia:habitats";
const KEY_CUSTOM_POKEMON = "pokopia:custom-pokemon";
const KEY_LANG = "pokopia:lang";

async function initStorage(){
  const statusEl = document.getElementById("status");
  try{
    if(window.storage){
      const g = await safeGet(KEY_GROUPS);
      const a = await safeGet(KEY_ASSIGN);
      const h = await safeGet(KEY_HABITATS);
      const cp = await safeGet(KEY_CUSTOM_POKEMON);
      const l = await safeGet(KEY_LANG);
      groups = g ? JSON.parse(g) : [];
      assignments = a ? JSON.parse(a) : {};
      habitats = h ? JSON.parse(h) : [...DEFAULT_HABITATS];
      customPokemon = cp ? JSON.parse(cp) : [];
      lang = l || "en";
      storageMode = "window";
      statusEl.textContent = t("statusOk");
      statusEl.className = "ok";
    } else if(typeof localStorage !== "undefined"){
      const g = localStorage.getItem(KEY_GROUPS);
      const a = localStorage.getItem(KEY_ASSIGN);
      const h = localStorage.getItem(KEY_HABITATS);
      const cp = localStorage.getItem(KEY_CUSTOM_POKEMON);
      const l = localStorage.getItem(KEY_LANG);
      groups = g ? JSON.parse(g) : [];
      assignments = a ? JSON.parse(a) : {};
      habitats = h ? JSON.parse(h) : [...DEFAULT_HABITATS];
      customPokemon = cp ? JSON.parse(cp) : [];
      lang = l || "en";
      storageMode = "local";
      statusEl.textContent = t("statusOk");
      statusEl.className = "ok";
    } else {
      throw new Error("Kein Speicher verfügbar");
    }
  }catch(e){
    storageMode = "memory";
    groups = [];
    assignments = {};
    habitats = [...DEFAULT_HABITATS];
    customPokemon = [];
    statusEl.textContent = t("statusWarn");
    statusEl.className = "warn";
  }
  migrateData();
}

// alte Datenformate (Habitat als reiner String) sauber überführen
function migrateData(){
  // Gruppen: description- und status-Feld sicherstellen
  groups.forEach(g=>{
    if(g.description === undefined) g.description = "";
    if(g.status === undefined) g.status = "wip";
  });

  // Habitate: falls noch als Strings gespeichert -> in Objekte {id,name,description} wandeln
  if(habitats.length && typeof habitats[0] === "string"){
    habitats = habitats.map(name => ({id: uidStatic(name)+"__"+uid(), name, description:""}));
  }
  habitats.forEach(h=>{ if(h.description === undefined) h.description = ""; });

  // Update: alte/fehlerhafte Platzhalternamen -> offizieller DLC-Name (Bubbly Basin), Blubbmeeria als deutscher Name in der Beschreibung
  const oldNames = ["Bubbly Basin (DLC)", "Blubbmeeria"];
  const oldPlaceholder = habitats.find(h=>oldNames.includes(h.name));
  if(oldPlaceholder){
    oldPlaceholder.name = "Bubbly Basin";
    if(!oldPlaceholder.description) oldPlaceholder.description = "Deutscher Name: Blubbmeeria";
  } else if(!habitats.some(h=>h.name === "Bubbly Basin")){
    habitats.push({id: uidStatic("Bubbly Basin"), name: "Bubbly Basin", description: "Deutscher Name: Blubbmeeria"});
  }

  // Zuordnungen: altes assign.habitat (String) -> neues assign.habitatId
  Object.keys(assignments).forEach(pid=>{
    const a = assignments[pid];
    if(a && a.habitat && !a.habitatId){
      let match = habitats.find(h=>h.name === a.habitat);
      if(!match){
        match = {id: uid(), name: a.habitat, description:""};
        habitats.push(match);
      }
      a.habitatId = match.id;
      delete a.habitat;
    }
  });
}

async function safeGet(key){
  try{
    const res = await window.storage.get(key,false);
    return res ? res.value : null;
  }catch(e){ return null; }
}
async function persist(force){
  if(editMode && !force) return; // Draft-Modus: erst bei "Speichern" wirklich schreiben
  try{
    if(storageMode === "window"){
      await window.storage.set(KEY_GROUPS, JSON.stringify(groups), false);
      await window.storage.set(KEY_ASSIGN, JSON.stringify(assignments), false);
      await window.storage.set(KEY_HABITATS, JSON.stringify(habitats), false);
      await window.storage.set(KEY_CUSTOM_POKEMON, JSON.stringify(customPokemon), false);
      await window.storage.set(KEY_LANG, lang, false);
    } else if(storageMode === "local"){
      localStorage.setItem(KEY_GROUPS, JSON.stringify(groups));
      localStorage.setItem(KEY_ASSIGN, JSON.stringify(assignments));
      localStorage.setItem(KEY_HABITATS, JSON.stringify(habitats));
      localStorage.setItem(KEY_CUSTOM_POKEMON, JSON.stringify(customPokemon));
      localStorage.setItem(KEY_LANG, lang);
    }
  }catch(e){
    console.error("Speichern fehlgeschlagen", e);
  }
}

let editSnapshot = null; // Zustand beim Betreten des Edit-Modus, für "Verwerfen"
let askBeforeRemoval = true; // Steuerung des X-Entfernen-Bestätigungsdialogs im Edit-Modus

/* ---------------------------------------------------------
   HELPERS
--------------------------------------------------------- */
function groupById(id){ return groups.find(g=>g.id===id); }
function habitatById(id){ return habitats.find(h=>h.id===id); }
function uid(){ return Math.random().toString(36).slice(2,10); }

function getAllPokemon(){
  return POKEMON_DATA.concat(customPokemon);
}

function allAbilities(){
  const s = new Set();
  getAllPokemon().forEach(p=>p.abilities.forEach(a=>s.add(a)));
  return [...s].sort();
}

/* ---------------------------------------------------------
   RENDER: FILTER DROPDOWNS
--------------------------------------------------------- */
function renderFilterDropdowns(){
  const gSel = document.getElementById("filter-group");
  const current = gSel.value;
  gSel.innerHTML = '<option value="">Alle</option><option value="__none__">– ohne Gruppe –</option>' +
    groups.map(g=>`<option value="${g.id}">${escapeHtml(g.name)}</option>`).join("");
  gSel.value = current && [...gSel.options].some(o=>o.value===current) ? current : "";

  const aSel = document.getElementById("filter-ability");
  const currentA = aSel.value;
  aSel.innerHTML = '<option value="">Alle</option>' +
    allAbilities().map(a=>`<option value="${escapeHtml(a)}">${escapeHtml(displayAbility(a))}</option>`).join("");
  aSel.value = currentA && [...aSel.options].some(o=>o.value===currentA) ? currentA : "";
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---------------------------------------------------------
   RENDER: POKÉMON TABLE
--------------------------------------------------------- */
function renderPokemonTable(){
  const tbody = document.getElementById("pokemon-tbody");
  const search = document.getElementById("search").value.trim().toLowerCase();
  const filterGroup = document.getElementById("filter-group").value;
  const filterAbility = document.getElementById("filter-ability").value;

  const rows = getAllPokemon().filter(p=>{
    if(search){
      const nameDe = (NAME_DE[p.id]||"").toLowerCase();
      const matches = p.name.toLowerCase().includes(search) || nameDe.includes(search) || p.nr.toLowerCase().includes(search);
      if(!matches) return false;
    }
    if(filterAbility && !p.abilities.includes(filterAbility)) return false;
    const assign = assignments[p.id];
    if(filterGroup === "__none__" && assign && assign.groupId) return false;
    if(filterGroup && filterGroup !== "__none__" && (!assign || assign.groupId !== filterGroup)) return false;
    return true;
  });

  const colCount = editMode ? 7 : 6;
  if(rows.length === 0){
    tbody.innerHTML = `<tr><td colspan="${colCount}"><div class="empty-state">${t("emptyTable")}</div></td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(p=>{
    const assign = assignments[p.id] || {};
    const g = assign.groupId ? groupById(assign.groupId) : null;
    const h = assign.habitatId ? habitatById(assign.habitatId) : null;

    const options = [`<option value="">${t("optNoneGroup")}</option>`]
      .concat(groups.map(gr=>`<option value="${gr.id}" ${assign.groupId===gr.id?"selected":""}>${escapeHtml(gr.name)}</option>`))
      .concat([`<option value="__new__">${t("optNewGroup")}</option>`]);

    const habitatOptions = [`<option value="">${t("optNoneHabitat")}</option>`]
      .concat(habitats.map(hh=>`<option value="${hh.id}" ${assign.habitatId===hh.id?"selected":""}>${escapeHtml(displayHabitat(hh))}</option>`))
      .concat([`<option value="__new__">${t("optNewHabitat")}</option>`]);

    return `
      <tr data-id="${p.id}">
        <td class="nr">${escapeHtml(p.nr)}</td>
        <td class="name">${escapeHtml(displayName(p))}${p.custom?` <span class="customtag">${t("customTag")}</span>`:''}</td>
        <td class="abilities">${p.abilities.map(a=>escapeHtml(displayAbility(a))).join(", ")}</td>
        <td class="litem">${p.litterItem ? escapeHtml(displayItem(p.litterItem)) : "–"}</td>
        <td>
          ${g ? `<button type="button" class="badge badgebtn" data-badge-for="${p.id}" style="background:${g.color}22;border-color:${g.color};color:${g.color};"><span class="dot" style="background:${g.color};"></span>${escapeHtml(g.name)}</button>` : ""}
          <select class="groupselect" data-id="${p.id}" ${g?'style="display:none;"':''}>${options.join("")}</select>
        </td>
        <td>
          <select class="habitatselect" data-id="${p.id}">${habitatOptions.join("")}</select>
        </td>
        ${editMode ? `<td>${p.custom ? `<button class="dangerbtn small" data-delpoke="${p.id}">${t("deleteBtn")}</button>` : `<span style="color:var(--text-dim);font-size:11px;">${t("baseData")}</span>`}</td>` : ""}
      </tr>`;
  }).join("");

  tbody.querySelectorAll("select.groupselect").forEach(sel=>{
    sel.addEventListener("change", onGroupSelectChange);
  });
  tbody.querySelectorAll("button.badgebtn").forEach(badge=>{
    badge.addEventListener("click", ()=>{
      const pokeId = badge.dataset.badgeFor;
      const row = tbody.querySelector(`tr[data-id="${CSS.escape(pokeId)}"]`);
      if(!row) return;
      const sel = row.querySelector("select.groupselect");
      if(!sel) return;
      badge.style.display = "none";
      sel.style.display = "";
      sel.focus();
      if(typeof sel.showPicker === "function"){
        try{ sel.showPicker(); }catch(e){}
      }
      const revert = ()=>{
        sel.style.display = "none";
        badge.style.display = "";
        sel.removeEventListener("blur", revert);
      };
      sel.addEventListener("blur", revert);
    });
  });
  tbody.querySelectorAll("select.habitatselect").forEach(sel=>{
    sel.addEventListener("change", onHabitatSelectChange);
  });
  tbody.querySelectorAll("button[data-delpoke]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.delpoke;
      const poke = customPokemon.find(p=>p.id===id);
      showConfirm({
        title:t("deleteCustomPokemonTitle"),
        text:textDeleteCustomPokemon(poke.name),
        onConfirm: ()=>{
          customPokemon = customPokemon.filter(p=>p.id!==id);
          delete assignments[id];
          persist();
          renderPokemonTable();
          renderFilterDropdowns();
          renderGroupsView();
          renderHabitatsView();
        }
      });
    });
  });
}

/* ---------------------------------------------------------
   GRUPPEN-ZUWEISUNG (aus der Pokémon-Tabelle)
--------------------------------------------------------- */
function onGroupSelectChange(e){
  const sel = e.target;
  const pokeId = sel.dataset.id;
  const newVal = sel.value;
  const current = assignments[pokeId] || {};
  const pokemon = getAllPokemon().find(p=>p.id===pokeId);

  if(newVal === "__new__"){
    sel.value = current.groupId || "";
    openNewGroupModal(pokemon, current.groupId);
    return;
  }
  if(!current.groupId && !newVal) return;
  if(current.groupId === newVal) return;

  if(!current.groupId){
    assignPokemonToGroup(pokemon.id, newVal || null);
    return;
  }

  const fromGroup = groupById(current.groupId);
  const toGroup = newVal ? groupById(newVal) : null;
  showConfirm({
    title: t("confirmGroupChangeTitle"),
    text: textGroupChange(displayName(pokemon), fromGroup ? fromGroup.name : "?", toGroup ? toGroup.name : null),
    onConfirm: ()=> assignPokemonToGroup(pokemon.id, newVal || null),
    onCancel: ()=> { sel.value = current.groupId; }
  });
}

function assignPokemonToGroup(pokeId, groupId){
  assignments[pokeId] = assignments[pokeId] || {};
  assignments[pokeId].groupId = groupId || null;
  persist();
  renderPokemonTable();
  renderGroupsView();
}

function openNewGroupModal(pokemonToAssign, currentGroupId){
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="modal">
      <h3>${t("newGroupModalTitle")}</h3>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;">
        <input type="color" id="modal-color" value="#7dd3c0">
        <input type="text" id="modal-name" placeholder="${t('groupNamePh')}" style="flex:1;">
      </div>
      <input type="text" id="modal-desc" placeholder="${t('descPh')}" style="width:100%;margin-bottom:16px;">
      <div class="row">
        <button class="ghostbtn" id="modal-cancel">${t("cancelBtn")}</button>
        <button class="primarybtn" id="modal-create">${t("createAssign")}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const nameInput = overlay.querySelector("#modal-name");
  nameInput.focus();

  overlay.querySelector("#modal-cancel").onclick = ()=>{
    overlay.remove();
    if(pokemonToAssign) renderPokemonTable();
  };
  overlay.querySelector("#modal-create").onclick = ()=>{
    const name = nameInput.value.trim();
    const color = overlay.querySelector("#modal-color").value;
    const description = overlay.querySelector("#modal-desc").value.trim();
    if(!name){ nameInput.focus(); return; }
    const newGroup = {id: uid(), name, color, description, status: "wip"};
    groups.push(newGroup);
    overlay.remove();

    const finalize = ()=>{
      if(pokemonToAssign) assignPokemonToGroup(pokemonToAssign.id, newGroup.id);
      persist();
      renderFilterDropdowns();
      renderGroupsView();
    };

    if(pokemonToAssign && currentGroupId){
      const fromGroup = groupById(currentGroupId);
      showConfirm({
        title:t("confirmGroupChangeTitle"),
        text:textGroupChangeNew(displayName(pokemonToAssign), fromGroup ? fromGroup.name : "?", name),
        onConfirm: finalize,
        onCancel: ()=>{ persist(); renderFilterDropdowns(); renderGroupsView(); renderPokemonTable(); }
      });
    } else {
      finalize();
    }
  };
}

/* ---------------------------------------------------------
   HABITAT-ZUWEISUNG (aus der Pokémon-Tabelle)
--------------------------------------------------------- */
function onHabitatSelectChange(e){
  const sel = e.target;
  const pokeId = sel.dataset.id;
  const val = sel.value;

  if(val === "__new__"){
    const current = (assignments[pokeId] && assignments[pokeId].habitatId) || "";
    sel.value = current;
    openNewHabitatModal(pokeId);
    return;
  }

  assignments[pokeId] = assignments[pokeId] || {};
  assignments[pokeId].habitatId = val || null;
  persist();
  renderHabitatsView();
}

function openNewHabitatModal(pokeId){
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="modal">
      <h3>${t("newHabitatModalTitle")}</h3>
      <p>${t("newHabitatModalDesc")}</p>
      <input type="text" id="modal-habitat-name" placeholder="${t('habitatNameModalPh')}" style="width:100%;margin-bottom:10px;">
      <input type="text" id="modal-habitat-desc" placeholder="${t('descPh')}" style="width:100%;margin-bottom:16px;">
      <div class="row">
        <button class="ghostbtn" id="modal-habitat-cancel">${t("cancelBtn")}</button>
        <button class="primarybtn" id="modal-habitat-create">${t("createAssign")}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const input = overlay.querySelector("#modal-habitat-name");
  input.focus();

  overlay.querySelector("#modal-habitat-cancel").onclick = ()=>{
    overlay.remove();
    if(pokeId) renderPokemonTable();
  };
  overlay.querySelector("#modal-habitat-create").onclick = ()=>{
    const name = input.value.trim();
    const description = overlay.querySelector("#modal-habitat-desc").value.trim();
    if(!name){ input.focus(); return; }
    const newHabitat = {id: uid(), name, description};
    habitats.push(newHabitat);

      assignments[pokeId] = assignments[pokeId] || {};
      assignments[pokeId].habitatId = newHabitat.id;

    overlay.remove();
    persist();
    renderPokemonTable();
    renderHabitatsView();
  };
}

/* ---------------------------------------------------------
   CONFIRM MODAL (generic)
--------------------------------------------------------- */
function showConfirm({title, text, onConfirm, onCancel}){
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="modal">
      <h3>${escapeHtml(title)}</h3>
      <p>${escapeHtml(text)}</p>
      <div class="row">
        <button class="ghostbtn" id="c-cancel">${t("cancelBtn")}</button>
        <button class="primarybtn" id="c-confirm">${t("confirmBtn")}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector("#c-cancel").onclick = ()=>{ overlay.remove(); onCancel && onCancel(); };
  overlay.querySelector("#c-confirm").onclick = ()=>{ overlay.remove(); onConfirm && onConfirm(); };
}

/* ---------------------------------------------------------
   GRUPPEN-ANSICHT (Bearbeitung läuft komplett über den globalen Edit-Mode)
--------------------------------------------------------- */
function renderGroupsView(){
  const grid = document.getElementById("groups-grid");
  if(groups.length === 0){
    grid.innerHTML = `<div class="empty-state">${t("emptyGroups")}</div>`;
    return;
  }
  grid.innerHTML = groups.map(g=>{
    const members = getAllPokemon().filter(p=> assignments[p.id] && assignments[p.id].groupId === g.id);

    const headHtml = editMode ? `
      <div class="colorname">
        <input type="color" class="edit-color" data-gid="${g.id}" value="${g.color}">
        <input type="text" class="edit-name" data-gid="${g.id}" value="${escapeHtml(g.name)}" placeholder="${t('groupNamePh')}">
      </div>` : `<h3><span class="dot" style="background:${g.color};"></span>${escapeHtml(g.name)}</h3>`;

    const descHtml = editMode
      ? `<input type="text" class="edit-desc inline-desc" data-gid="${g.id}" value="${escapeHtml(g.description||"")}" placeholder="${t('descPh')}">`
      : (g.description ? `<div class="desc">${escapeHtml(g.description)}</div>` : "");

    const memberListHtml = members.length ? `<ul>${members.map(m=>{
      const assign = assignments[m.id]||{};
      const hb = assign.habitatId ? habitatById(assign.habitatId) : null;
      const habitatCell = editMode
        ? `<select class="member-habitat" data-pid="${m.id}">${['<option value="">–</option>'].concat(habitats.map(hh=>`<option value="${hh.id}" ${assign.habitatId===hh.id?"selected":""}>${escapeHtml(displayHabitat(hh))}</option>`)).join("")}</select>`
        : (hb ? `<span class="hab">${escapeHtml(displayHabitat(hb))}</span>` : "");
      return `<li data-pid="${m.id}" ${editMode?'draggable="true"':""}>
        <span class="member-main">
          <span class="member-name">${escapeHtml(displayName(m))}</span>
          <span class="member-abilities">· ${escapeHtml(tooltipText(m))}</span>
        </span>
        <span class="member-right">${habitatCell}${editMode?`<button type="button" class="removepoke" data-pid="${m.id}" data-group="${g.id}" title="${t('deleteBtn')}">×</button>`:""}</span>
      </li>`;
    }).join("")}</ul>` : `<div class="empty">${t("emptyMembersGroup")}</div>`;

    return `
      <div class="groupcard" style="border-top-color:${g.color};" data-gid="${g.id}">
        <div class="cardhead">
          ${headHtml}
          <div class="cardhead-actions">
            <button class="statusbtn ${g.status==='done'?'done':'wip'}" data-toggle-status="${g.id}">${g.status==='done'?t('done'):t('wip')}</button>
          </div>
        </div>
        ${descHtml}
        <div class="count">${members.length}${t("countSuffix")}</div>
        ${memberListHtml}
        ${editMode ? `
          <div class="addpoke">
            <label>${t("addPokeToGroup")}</label>
            <input type="text" class="addpoke-search" placeholder="${t('searchPokePh')}">
            <div class="addpoke-results"></div>
          </div>
          <div class="editrow">
            <button class="dangerbtn" data-delete-group="${g.id}">${t("deleteGroupBtn")}</button>
          </div>` : ""}
      </div>`;
  }).join("");

  grid.querySelectorAll("[data-toggle-status]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const g = groupById(btn.dataset.toggleStatus);
      g.status = g.status === "done" ? "wip" : "done";
      persist();
      renderGroupsView();
    });
  });

  // Inline-Bearbeitung Name/Farbe/Beschreibung (auto-save on change)
  grid.querySelectorAll(".edit-name, .edit-color, .edit-desc").forEach(el=>{
    el.addEventListener("change", ()=>{
      const g = groupById(el.dataset.gid);
      if(!g) return;
      const card = grid.querySelector(`.groupcard[data-gid="${g.id}"]`);
      const nameInput = card.querySelector(".edit-name");
      const name = nameInput.value.trim();
      if(!name){ nameInput.focus(); return; }
      g.name = name;
      g.color = card.querySelector(".edit-color").value;
      g.description = card.querySelector(".edit-desc").value.trim();
      persist();
      renderGroupsView();
      renderFilterDropdowns();
      renderPokemonTable();
    });
  });

  grid.querySelectorAll("[data-delete-group]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const gid = btn.dataset.deleteGroup;
      const g = groupById(gid);
      const memberCount = getAllPokemon().filter(p=> assignments[p.id] && assignments[p.id].groupId === gid).length;
      showConfirm({
        title: t("deleteGroupBtn") + "?",
        text: textGroupDelete(g.name, memberCount),
        onConfirm: ()=>{
          groups = groups.filter(x=>x.id!==gid);
          Object.keys(assignments).forEach(pid=>{
            if(assignments[pid].groupId === gid) assignments[pid].groupId = null;
          });
          persist();
          renderGroupsView();
          renderFilterDropdowns();
          renderPokemonTable();
        }
      });
    });
  });

  // X: Pokémon aus Gruppe entfernen (nur im Edit-Mode sichtbar; Bestätigung je nach "Vor Entfernen fragen")
  grid.querySelectorAll(".removepoke").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const pid = btn.dataset.pid;
      const gid = btn.dataset.group;
      const pokemon = getAllPokemon().find(p=>p.id===pid);
      const g = groupById(gid);
      const doRemove = ()=>{
        assignments[pid] = assignments[pid] || {};
        assignments[pid].groupId = null;
        persist();
        renderGroupsView();
        renderFilterDropdowns();
        renderPokemonTable();
      };
      if(!askBeforeRemoval){
        doRemove();
      } else {
        showConfirm({
          title: t("deleteBtn") + "?",
          text: textRemoveFromGroup(displayName(pokemon), g.name),
          onConfirm: doRemove
        });
      }
    });
  });

  // Habitat-Dropdown pro Mitglied (nur im Edit-Mode sichtbar)
  grid.querySelectorAll(".member-habitat").forEach(sel=>{
    sel.addEventListener("change", ()=>{
      const pid = sel.dataset.pid;
      assignments[pid] = assignments[pid] || {};
      assignments[pid].habitatId = sel.value || null;
      persist();
      renderHabitatsView();
    });
  });

  // Drag & Drop zwischen Gruppen-Karten (nur im Edit-Mode aktiv, da li nur dann draggable ist)
  grid.querySelectorAll(".groupcard li[draggable]").forEach(li=>{
    li.addEventListener("dragstart", (e)=>{
      e.dataTransfer.setData("text/plain", li.dataset.pid);
      li.classList.add("dragging");
    });
    li.addEventListener("dragend", ()=> li.classList.remove("dragging"));
  });
  grid.querySelectorAll(".groupcard").forEach(card=>{
    card.addEventListener("dragover", (e)=>{
      if(!editMode) return;
      e.preventDefault();
      card.classList.add("drag-over");
    });
    card.addEventListener("dragleave", ()=> card.classList.remove("drag-over"));
    card.addEventListener("drop", (e)=>{
      if(!editMode) return;
      e.preventDefault();
      card.classList.remove("drag-over");
      const pid = e.dataTransfer.getData("text/plain");
      if(!pid) return;
      const gid = card.dataset.gid;
      assignments[pid] = assignments[pid] || {};
      if(assignments[pid].groupId === gid) return;
      assignments[pid].groupId = gid;
      persist();
      renderGroupsView();
      renderFilterDropdowns();
      renderPokemonTable();
    });
  });

  // Pokémon-Suche zum Hinzufügen (nur im Edit-Mode sichtbar)
  grid.querySelectorAll(".groupcard").forEach(card=>{
    const gid = card.dataset.gid;
    const searchInput = card.querySelector(".addpoke-search");
    const resultsEl = card.querySelector(".addpoke-results");
    if(!searchInput) return;
    searchInput.addEventListener("input", ()=>{
      renderAddPokeResults(searchInput.value, resultsEl, (pokemon)=>{
        const current = assignments[pokemon.id] || {};
        if(current.groupId === gid) return;
        if(!current.groupId){
          assignPokemonToGroup(pokemon.id, gid);
          renderGroupsView();
          renderFilterDropdowns();
        } else {
          const fromGroup = groupById(current.groupId);
          showConfirm({
            title: t("confirmGroupChangeTitle"),
            text: textGroupChange(displayName(pokemon), fromGroup ? fromGroup.name : "?", groupById(gid).name),
            onConfirm: ()=>{
              assignPokemonToGroup(pokemon.id, gid);
              renderGroupsView();
              renderFilterDropdowns();
            }
          });
        }
      });
    });
  });
}

      <li data-pid="${m.id}" ${editMode?'draggable="true"':""}>
        <span class="member-main">
          <span class="member-name">${escapeHtml(displayName(m))}</span>
          <span class="member-abilities">· ${escapeHtml(tooltipText(m))}</span>
        </span>
        <span class="member-right">${editMode?`<button type="button" class="removepoke" data-pid="${m.id}" data-habitat="${h.id}" title="${t('deleteBtn')}">×</button>`:""}</span>
      </li>`).join("")}</ul>` : `<div class="empty">${t("emptyMembersHabitat")}</div>`;

    return `
      <div class="groupcard" style="border-top-color:var(--accent-2);" data-hid="${h.id}">
        <div class="cardhead">
          ${headHtml}
        </div>
        ${descHtml}
        <div class="count">${members.length}${t("countSuffix")}</div>
        ${memberListHtml}
        ${editMode ? `
          <div class="addpoke">
            <label>${t("addPokeToHabitat")}</label>
            <input type="text" class="addpoke-search" placeholder="${t('searchPokePh')}">
            <div class="addpoke-results"></div>
          </div>
          <div class="editrow">
            <button class="dangerbtn" data-delete-habitat="${h.id}">${t("deleteHabitatBtn")}</button>
          </div>` : ""}
      </div>`;
  }).join("");

  // Inline-Bearbeitung Name/Beschreibung (auto-save on change)
  grid.querySelectorAll(".edit-hname, .edit-hdesc").forEach(el=>{
    el.addEventListener("change", ()=>{
      const hid = el.dataset.hid;
      const h = habitatById(hid);
      if(!h) return;
      const card = grid.querySelector(`.groupcard[data-hid="${hid}"]`);
      const nameInput = card.querySelector(".edit-hname");
      const name = nameInput.value.trim();
      if(!name){ nameInput.focus(); return; }
      h.name = name;
      h.description = card.querySelector(".edit-hdesc").value.trim();
      persist();
      renderHabitatsView();
      renderPokemonTable();
      renderGroupsView();
    });
  });

  grid.querySelectorAll("[data-delete-habitat]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const hid = btn.dataset.deleteHabitat;
      const h = habitatById(hid);
      const memberCount = getAllPokemon().filter(p=> assignments[p.id] && assignments[p.id].habitatId === hid).length;
      showConfirm({
        title: t("deleteHabitatBtn") + "?",
        text: textHabitatDelete(displayHabitat(h), memberCount),
        onConfirm: ()=>{
          habitats = habitats.filter(x=>x.id!==hid);
          Object.keys(assignments).forEach(pid=>{
            if(assignments[pid].habitatId === hid) assignments[pid].habitatId = null;
          });
          persist();
          renderHabitatsView();
          renderPokemonTable();
          renderGroupsView();
        }
      });
    });
  });

  // X: Pokémon aus Habitat entfernen (nur im Edit-Mode sichtbar; Bestätigung je nach "Vor Entfernen fragen")
  grid.querySelectorAll(".removepoke").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const pid = btn.dataset.pid;
      const hid = btn.dataset.habitat;
      const pokemon = getAllPokemon().find(p=>p.id===pid);
      const h = habitatById(hid);
      const doRemove = ()=>{
        assignments[pid] = assignments[pid] || {};
        assignments[pid].habitatId = null;
        persist();
        renderHabitatsView();
        renderPokemonTable();
        renderGroupsView();
      };
      if(!askBeforeRemoval){
        doRemove();
      } else {
        showConfirm({
          title: t("deleteBtn") + "?",
          text: textRemoveFromHabitat(displayName(pokemon), displayHabitat(h)),
          onConfirm: doRemove
        });
      }
    });
  });

  // Drag & Drop zwischen Habitat-Karten (nur im Edit-Mode aktiv)
  grid.querySelectorAll(".groupcard li[draggable]").forEach(li=>{
    li.addEventListener("dragstart", (e)=>{
      e.dataTransfer.setData("text/plain", li.dataset.pid);
      li.classList.add("dragging");
    });
    li.addEventListener("dragend", ()=> li.classList.remove("dragging"));
  });
  grid.querySelectorAll(".groupcard").forEach(card=>{
    card.addEventListener("dragover", (e)=>{
      if(!editMode) return;
      e.preventDefault();
      card.classList.add("drag-over");
    });
    card.addEventListener("dragleave", ()=> card.classList.remove("drag-over"));
    card.addEventListener("drop", (e)=>{
      if(!editMode) return;
      e.preventDefault();
      card.classList.remove("drag-over");
      const pid = e.dataTransfer.getData("text/plain");
      if(!pid) return;
      const hid = card.dataset.hid;
      assignments[pid] = assignments[pid] || {};
      if(assignments[pid].habitatId === hid) return;
      assignments[pid].habitatId = hid;
      persist();
      renderHabitatsView();
      renderPokemonTable();
      renderGroupsView();
    });
  });

  // Pokémon-Suche zum Hinzufügen (nur im Edit-Mode sichtbar)
  grid.querySelectorAll(".groupcard").forEach(card=>{
    const hid = card.dataset.hid;
    const searchInput = card.querySelector(".addpoke-search");
    const resultsEl = card.querySelector(".addpoke-results");
    if(!searchInput) return;
    searchInput.addEventListener("input", ()=>{
      renderAddPokeResults(searchInput.value, resultsEl, (pokemon)=>{
        assignments[pokemon.id] = assignments[pokemon.id] || {};
        assignments[pokemon.id].habitatId = hid;
        persist();
        renderHabitatsView();
        renderPokemonTable();
      });
    });
  });
}

// gemeinsame Trefferliste für die Pokémon-Suche in Gruppen-/Habitat-Edit-Panels
function renderAddPokeResults(query, resultsEl, onPick){
  const q = query.trim().toLowerCase();
  if(!q){ resultsEl.innerHTML = ""; return; }
  const matches = getAllPokemon()
    .filter(p=> p.name.toLowerCase().includes(q) || (NAME_DE[p.id]||"").toLowerCase().includes(q) || p.nr.toLowerCase().includes(q))
    .slice(0, 8);
  if(matches.length === 0){
    resultsEl.innerHTML = `<div class="nomatch">${t("nomatch")}</div>`;
    return;
  }
  resultsEl.innerHTML = matches.map(p=>
    `<button type="button" data-pickpoke="${p.id}">${escapeHtml(p.nr)} · ${escapeHtml(displayName(p))}</button>`
  ).join("");
  resultsEl.querySelectorAll("[data-pickpoke]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const pokemon = getAllPokemon().find(p=>p.id===btn.dataset.pickpoke);
      onPick(pokemon);
    });
  });
}

/* ---------------------------------------------------------
   ADD GROUP / HABITAT (Formulare oben im Gruppen-Tab)
--------------------------------------------------------- */
document.getElementById("btn-add-group").addEventListener("click", ()=>{
  const nameInput = document.getElementById("new-group-name");
  const colorInput = document.getElementById("new-group-color");
  const descInput = document.getElementById("new-group-desc");
  const name = nameInput.value.trim();

  groups.push({id: uid(), name, color: colorInput.value, description: descInput.value.trim(), status: "wip"});
  nameInput.value = ""; descInput.value = "";
  persist();
  renderGroupsView();
  renderFilterDropdowns();
  renderPokemonTable();
});

document.getElementById("btn-add-habitat").addEventListener("click", ()=>{
  const nameInput = document.getElementById("new-habitat-name");
  const descInput = document.getElementById("new-habitat-desc");
  const name = nameInput.value.trim();
  if(!name){ nameInput.focus(); return; }
  habitats.push({id: uid(), name, description: descInput.value.trim()});
  nameInput.value = ""; descInput.value = "";
  persist();
  renderHabitatsView();
  renderPokemonTable();
});

/* ---------------------------------------------------------
   EDIT MODE + NEUES POKÉMON ANLEGEN
--------------------------------------------------------- */
document.getElementById("btn-lang").addEventListener("click", ()=>{
  lang = lang === "de" ? "en" : "de";
  document.getElementById("btn-lang").textContent = lang === "de" ? "🌐 DE" : "🌐 EN";
  persist(true);
  applyI18n();
  renderFilterDropdowns();
  renderPokemonTable();
  renderGroupsView();
  renderHabitatsView();
});

function setHeaderEditButtons(){
  document.getElementById("btn-editmode").style.display = editMode ? "none" : "";
  document.getElementById("btn-export").style.display = editMode ? "none" : "";
  document.getElementById("btn-import").style.display = editMode ? "none" : "";
  document.getElementById("btn-discard").style.display = editMode ? "" : "none";
  document.getElementById("btn-save").style.display = editMode ? "" : "none";
  document.getElementById("ask-before-removal-wrap").style.display = editMode ? "" : "none";
  document.getElementById("new-pokemon-form").style.display = editMode ? "" : "none";
  document.getElementById("th-action").style.display = editMode ? "" : "none";
}

document.getElementById("ask-before-removal").addEventListener("change", (e)=>{
  askBeforeRemoval = e.target.checked;
});

document.getElementById("btn-editmode").addEventListener("click", ()=>{
  editSnapshot = JSON.stringify({groups, assignments, habitats, customPokemon});
  editMode = true;
  askBeforeRemoval = true;
  document.getElementById("ask-before-removal").checked = true;
  setHeaderEditButtons();
  renderPokemonTable();
  renderGroupsView();
  renderHabitatsView();
});

document.getElementById("btn-save").addEventListener("click", ()=>{
  editMode = false;
  persist(true);
  editSnapshot = null;
  setHeaderEditButtons();
  renderPokemonTable();
  renderGroupsView();
  renderHabitatsView();
});

document.getElementById("btn-discard").addEventListener("click", ()=>{
  showConfirm({
    title: t("discardTitle"),
    text: t("discardText"),
    onConfirm: ()=>{
      if(editSnapshot){
        const snap = JSON.parse(editSnapshot);
        groups = snap.groups;
        assignments = snap.assignments;
        habitats = snap.habitats;
        customPokemon = snap.customPokemon;
      }
      editMode = false;
      editSnapshot = null;
      setHeaderEditButtons();
      renderFilterDropdowns();
      renderPokemonTable();
      renderGroupsView();
      renderHabitatsView();
    }
  });
});

document.getElementById("btn-add-pokemon").addEventListener("click", ()=>{
  const nrInput = document.getElementById("new-poke-nr");
  const nameInput = document.getElementById("new-poke-name");
  const abilitiesInput = document.getElementById("new-poke-abilities");
  const litterInput = document.getElementById("new-poke-litter");

  const name = nameInput.value.trim();
  const nr = nrInput.value.trim() || "—";
  const abilities = abilitiesInput.value.split(",").map(a=>a.trim()).filter(Boolean);
  const litterItem = litterInput.value.trim() || null;

  if(!name){ nameInput.focus(); return; }
  if(abilities.length === 0){ abilitiesInput.focus(); return; }

  const id = "custom__" + uid();
  customPokemon.push({id, nr, name, abilities, litterItem, custom:true});

  nrInput.value = ""; nameInput.value = ""; abilitiesInput.value = ""; litterInput.value = "";
  persist();
  renderPokemonTable();
  renderFilterDropdowns();
});

  document.getElementById("tab-groups").classList.remove("active");
  document.getElementById("view-pokemon").style.display = "";
  document.getElementById("view-groups").style.display = "none";

  document.getElementById("view-groups").style.display = "";

});

document.getElementById("filter-group").addEventListener("change", renderPokemonTable);
document.getElementById("filter-ability").addEventListener("change", renderPokemonTable);

/* ---------------------------------------------------------
   EXPORT / IMPORT
--------------------------------------------------------- */
document.getElementById("btn-export").addEventListener("click", ()=>{
  const data = {groups, assignments, habitats, customPokemon, exportedAt: new Date().toISOString()};
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "pokopia-gruppen-backup.json";
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById("btn-import").addEventListener("click", ()=>{
  document.getElementById("file-import").click();
});
document.getElementById("file-import").addEventListener("change", (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      showConfirm({
        title:t("importOverwriteTitle"),
        text:textImportOverwrite(data.groups?.length||0, (data.habitats||[]).length, (data.customPokemon||[]).length, Object.keys(data.assignments||{}).length),
        onConfirm: ()=>{
          groups = data.groups || [];
          assignments = data.assignments || {};
          habitats = data.habitats && data.habitats.length ? data.habitats : [...DEFAULT_HABITATS];
          customPokemon = data.customPokemon || [];
          migrateData();
          persist();
          renderFilterDropdowns();
          renderPokemonTable();
          renderGroupsView();
          renderHabitatsView();
        }
      });
    }catch(err){
      alert(textFileReadError(err.message));
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

/* ---------------------------------------------------------
   INIT
--------------------------------------------------------- */

(async function init(){
  await initStorage();
  document.getElementById("btn-lang").textContent = lang === "de" ? "🌐 DE" : "🌐 EN";
  applyI18n();
  renderFilterDropdowns();
  renderPokemonTable();
  renderGroupsView();
  renderHabitatsView();
})();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(e=>console.warn("Service Worker Registrierung fehlgeschlagen:", e));
  });
  // Sobald ein neuer Service Worker die Kontrolle übernimmt (= neue Version verfügbar),
  // einmalig neu laden, damit Updates sofort sichtbar sind statt erst beim übernächsten Öffnen.
  let refreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(refreshing) return;
    refreshing = true;
    window.location.reload();
  });
}
</script>
